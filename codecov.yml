coverage:
  status:
    project:
      default: { target: auto, threshold: 1% }
    patch:
      default: { target: 80%, threshold: 1% }
ignore:
  - "**/mocks/**"
  - "main.go"
  - "**/*_test.go"
  - "**/internal/cloakdriver/**"
  - "**/version/**"
  # relay 的一致性测试工具：只被别的包的测试调用（relayserver 的测试、对 wrangler dev 的 TestExternalRelay），
  # 覆盖率按被测的包统计，算在这里永远是 0
  - "internal/remote/relaytest/**"
