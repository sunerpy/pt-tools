services:
  cloakbrowser-manager:
    # NOTE: Pin to specific version + SHA digest (R21). Discover the actual SHA via:
    #   docker pull cloakhq/cloakbrowser-manager:0.0.4
    #   docker inspect cloakhq/cloakbrowser-manager:0.0.4 | jq '.[0].RepoDigests[0]'
    # If the digest is not yet known (alpha image, evolving), use just the tag and document this in the README + a TODO comment here.
    image: cloakhq/cloakbrowser-manager:0.0.4
    # image: cloakhq/cloakbrowser-manager:0.0.4@sha256:<digest>  # uncomment after digest captured
    container_name: pt-tools-cloak
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # bind to localhost only (security); the Manager UI is where you create the profile
    volumes:
      - cloak_profiles:/data
    environment:
      - AUTH_TOKEN=${CLOAK_AUTH_TOKEN:?must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pt-tools:
    image: sunerpy/pt-tools:latest
    container_name: pt-tools
    restart: unless-stopped
    depends_on:
      cloakbrowser-manager:
        condition: service_healthy
    ports:
      # pt-tools listens on 8080 inside the container (PT_PORT); 8081 on the host keeps it apart from the Manager
      - "127.0.0.1:8081:8080"
    volumes:
      # The image's HOME is /app: the database, secret.key and logs live in /app/.pt-tools
      - pttools_data:/app/.pt-tools
    # pt-tools does not read CloakBrowser settings from the environment. After the first login, open
    # 系统 → CloakBrowser and fill in:
    #   CloakBrowser-Manager 端点: http://cloakbrowser-manager:8080
    #   Auth Token:               the CLOAK_AUTH_TOKEN from .env
    #   Profile ID:               a profile created in the Manager UI (http://localhost:8080)
    # The login-probe fallback is used only when all three are set.
    healthcheck:
      # -Y off: busybox wget ignores no_proxy, and Docker's client proxy settings put HTTP_PROXY into the container
      test: ["CMD-SHELL", "wget -Y off -qO- http://localhost:8080/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  cloak_profiles:
  pttools_data:
