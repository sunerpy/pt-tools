        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster_path: { type: string }
        vote_average: { type: number, format: double }
        in_library: { type: boolean }
        subscribed: { type: boolean }
        subscription_id: { type: integer }
