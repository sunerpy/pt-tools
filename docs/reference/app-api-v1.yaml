openapi: 3.0.3
info:
  title: pt-tools App API
  version: "1"
  description: |
    给手机 App 和脚本用的接口（`/api/app/v1/*`），说明见 docs/reference/app-api.md。
    这份描述是契约：web 包的测试用它校验真实 handler 的回应，App 的 Dart 模型由它生成（apps/mobile/packages/ptt_api）。
    兼容规则：新增接口或字段不算不兼容，客户端忽略不认识的字段；不兼容的改动才把 `remote_api_level` 加一。
servers:
  - url: /api/app/v1
security:
  - bearer: []
tags:
  - name: App
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [App]
      summary: 版本、兼容级别、功能组与调用者自己的权限
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppMeta" }
        default: { $ref: "#/components/responses/Error" }
  /updates:
    get:
      operationId: getUpdates
      tags: [App]
      summary: 有没有新版本
      parameters:
        - name: include_prerelease
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUpdates" }
        default: { $ref: "#/components/responses/Error" }
  /overview:
    get:
      operationId: getOverview
      tags: [App]
      summary: 已启用站点的合计与今天的增量
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOverview" }
        default: { $ref: "#/components/responses/Error" }
  /sites:
    get:
      operationId: listSites
      tags: [App]
      summary: 站点、登录状态、今天的签到与站点上的用户数据
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSiteList" }
        default: { $ref: "#/components/responses/Error" }
  /sites/{site}/attend:
    post:
      operationId: attendSite
      tags: [App]
      summary: 立即签到
      parameters:
        - $ref: "#/components/parameters/Site"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSiteAttendance" }
        default: { $ref: "#/components/responses/Error" }
  /favicon/{site}:
    get:
      operationId: getFavicon
      tags: [App]
      summary: 站点图标（图片）
      parameters:
        - $ref: "#/components/parameters/Site"
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /images/tmdb/{size}/{file}:
    get:
      operationId: getTmdbImage
      tags: [App]
      summary: TMDB 图片（海报等），由 pt-tools 按自己的 TMDB 图片地址与代理去取
      parameters:
        - name: size
          in: path
          required: true
          description: 海报尺寸（不提供原图）
          schema: { type: string, enum: [w92, w154, w185, w342, w500, w780] }
        - name: file
          in: path
          required: true
          description: poster_path 去掉开头的 /
          schema: { type: string, pattern: "^[A-Za-z0-9_-]+\\.(jpg|jpeg|png|webp)$" }
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /downloaders:
    get:
      operationId: listDownloaders
      tags: [App]
      summary: 启用的下载器与它们现在的速度、剩余空间
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDownloaderList" }
        default: { $ref: "#/components/responses/Error" }
  /torrents:
    get:
      operationId: listTorrents
      tags: [App]
      summary: 下载器里的种子
      parameters:
        - name: downloader_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: state
          in: query
          schema:
            type: string
            enum: [downloading, seeding, paused, stopped, queued, checking, error]
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                added_at,
                completed_at,
                title,
                progress,
                size,
                ratio,
                state,
                upload_speed,
                download_speed,
                eta,
                seeds,
              ]
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/Page"
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTorrentPage" }
        default: { $ref: "#/components/responses/Error" }
  /torrents/actions:
    post:
      operationId: torrentActions
      tags: [App]
      summary: 暂停、继续、删除种子
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppTorrentActionsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTorrentActionsResult" }
        default: { $ref: "#/components/responses/Error" }
  /search:
    post:
      operationId: search
      tags: [App]
      summary: 多站搜索（只要读取权限）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSearchResult" }
        default: { $ref: "#/components/responses/Error" }
  /push:
    post:
      operationId: push
      tags: [App]
      summary: 把搜索到的种子推送到下载器
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppPushRequest" }
      responses:
        "200":
          description: OK（被拦下时 success 为 false）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPushResult" }
        default: { $ref: "#/components/responses/Error" }
  /tasks:
    get:
      operationId: listTasks
      tags: [App]
      summary: 任务列表（推送记录）
      parameters:
        - name: site
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Q"
        - name: pushed
          in: query
          schema: { type: string, enum: ["1"] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize100"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTaskPage" }
        default: { $ref: "#/components/responses/Error" }
  /brush/tasks:
    post:
      operationId: createBrushTask
      tags: [App]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppBrushInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppBrushConfig" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listBrushTasks
      tags: [App]
      summary: 刷流任务
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppBrushTask" }
        default: { $ref: "#/components/responses/Error" }
  /media/history:
    get:
      operationId: listMediaHistory
      tags: [App]
      summary: 整理历史
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [done, failed, skipped, removed] }
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize100"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppMediaHistoryPage" }
        default: { $ref: "#/components/responses/Error" }
  /media/history/{id}/retry:
    post:
      operationId: retryMediaHistory
      tags: [App]
      summary: 重新整理一条整理记录对应的种子（多半是失败的那条）
      parameters:
        - $ref: "#/components/parameters/HistoryID"
      responses:
        "200":
          description: 这次整理的结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOrganizeResult" }
        default: { $ref: "#/components/responses/Error" }
  /media/history/{id}/scrape:
    post:
      operationId: rescrapeMediaHistory
      tags: [App]
      summary: 重新刮削一条整理记录所在的电影或剧集（这个媒体库里同一部整理好的都刮削；媒体库要开着刮削）
      parameters:
        - $ref: "#/components/parameters/HistoryID"
      responses:
        "200":
          description: 这次刮削的结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppRescrapeResult" }
        default: { $ref: "#/components/responses/Error" }
  /media/libraries:
    get:
      operationId: listMediaLibraries
      tags: [App]
      summary: 媒体库列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppMediaLibrary" }
        default: { $ref: "#/components/responses/Error" }
  /media/recognize:
    post:
      operationId: recognizeMedia
      tags: [App]
      summary: 识别一个种子标题：解析名字、年份、季集、规格，按手动纠正与识别词到 TMDB 找对应的条目（不改动任何东西）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppRecognizeInput" }
      responses:
        "200":
          description: 识别结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppRecognition" }
        default: { $ref: "#/components/responses/Error" }
  /media/organize/preview:
    post:
      operationId: previewMediaOrganize
      tags: [App]
      summary: 预览整理下载器里的一个种子：认出的条目、媒体库、每个视频的目标位置（不改动任何东西）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppOrganizeInput" }
      responses:
        "200":
          description: 整理计划
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOrganizePlan" }
        default: { $ref: "#/components/responses/Error" }
  /media/organize:
    post:
      operationId: organizeMedia
      tags: [App]
      summary: 把下载器里的一个种子整理进媒体库（按媒体库的方式硬链接、复制或移动，刮削，通知媒体服务器扫描）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppOrganizeInput" }
      responses:
        "200":
          description: 整理的结果；queued 为真时还在后台进行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOrganizeResult" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [App]
      summary: 订阅列表
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, paused, pending, done] }
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppSubscription" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSubscription
      tags: [App]
      summary: 新建订阅
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSubscriptionCreate" }
      responses:
        "200":
          description: 新建的订阅
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSubscription" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [App]
      summary: 订阅详情：每一集与下载过的种子
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSubscriptionDetail" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateSubscription
      tags: [App]
      summary: 修改订阅的设置（只改给了的字段；条目与季不能改）
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSubscriptionUpdate" }
      responses:
        "200":
          description: 更新后的订阅
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSubscription" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSubscription
      tags: [App]
      summary: 删除订阅（下载器里的种子与媒体库里的文件不动）
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOK" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/status:
    post:
      operationId: setSubscriptionStatus
      tags: [App]
      summary: 暂停或恢复订阅
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSubscriptionStatus" }
      responses:
        "200":
          description: 更新后的订阅
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSubscription" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/search:
    post:
      operationId: searchSubscription
      tags: [App]
      summary: 立即搜索一次
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppMessage" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/torrents/{tid}/organize:
    post:
      operationId: organizeSubscriptionTorrent
      tags: [App]
      summary: 重新整理订阅下载的一个种子（整季包与单集一样）：按订阅的条目与媒体库，已经整理好的文件不动
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
        - $ref: "#/components/parameters/SubscriptionTorrentID"
      responses:
        "200":
          description: 这次整理的结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOrganizeResult" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/torrents/{tid}/scrape:
    post:
      operationId: rescrapeSubscriptionTorrent
      tags: [App]
      summary: 重新刮削订阅下载的一个种子整理进的电影或剧集（要有整理好的文件）
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
        - $ref: "#/components/parameters/SubscriptionTorrentID"
      responses:
        "200":
          description: 这次刮削的结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppRescrapeResult" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/episodes:
    get:
      operationId: listSubscriptionEpisodes
      tags: [App]
      summary: 追剧每一集的情况（电影没有分集，回 400）
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppEpisode" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/episodes/{n}/skip:
    post:
      operationId: skipSubscriptionEpisode
      tags: [App]
      summary: 跳过这一集（不追），或重新要它
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
        - $ref: "#/components/parameters/EpisodeNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppEpisodeSkip" }
      responses:
        "200":
          description: 改了以后每一集的情况
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppEpisode" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/episodes/{n}/unlock:
    post:
      operationId: unlockSubscriptionEpisode
      tags: [App]
      summary: 这一集不受版本锁限制（换别的组或分辨率，并马上搜一次），或恢复版本锁
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
        - $ref: "#/components/parameters/EpisodeNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppEpisodeUnlock" }
      responses:
        "200":
          description: 改了以后每一集的情况
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppEpisode" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/runs:
    get:
      operationId: listSubscriptionRuns
      tags: [App]
      summary: 订阅的运行记录（新的在前）：每次搜索找到了什么、为什么没要、推送了哪个
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize100"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSubscriptionRunPage" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/schedule/preview:
    post:
      operationId: previewSchedule
      tags: [App]
      summary: 看一个追剧定时接下来几次什么时候搜（只读，不改订阅；定时不对时回 400 并写明哪里不对）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSchedulePreviewInput" }
      responses:
        "200":
          description: 接下来几次搜索的时间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSchedulePreview" }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/episode-rules:
    get:
      operationId: listEpisodeRules
      tags: [App]
      summary: 追剧的集号规则（每个制作组一条；组为空的对所有组）
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppEpisodeRule" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveEpisodeRule
      tags: [App]
      summary: 设一个制作组的集号规则（这个组已有规则时替换）
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppEpisodeRuleInput" }
      responses:
        "200":
          description: 改了以后的全部规则
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppEpisodeRule" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEpisodeRule
      tags: [App]
      summary: 删掉一个制作组的集号规则
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
        - name: group
          in: query
          description: 制作组；不给是删对所有组的那条
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: 删了以后的全部规则
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppEpisodeRule" }
        default: { $ref: "#/components/responses/Error" }
  /explore:
    get:
      operationId: explore
      tags: [App]
      summary: 探索：TMDB 的热门、流行与搜索
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [movie, tv] }
        - name: list
          in: query
          schema: { type: string, enum: [trending, popular, search] }
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppExplorePage" }
        default: { $ref: "#/components/responses/Error" }
  /assistant/status:
    get:
      operationId: getAssistantStatus
      tags: [App]
      summary: AI 助手启用没有、用的模型、调用者能不能确认改动类操作（不含 Key 与接口地址）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAssistantStatus" }
        default: { $ref: "#/components/responses/Error" }
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      tags: [App]
      summary: 调用者自己的 AI 助手会话（最近的在前，最多 100 个）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppAssistantConversation" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAssistantConversation
      tags: [App]
      summary: 新建会话；带了 message 时接着发这一条（回 202 与这次运行）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppAssistantCreate" }
      responses:
        "201":
          description: 新建的会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAssistantCreateResult" }
        "202":
          description: 新建的会话与开始的运行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAssistantCreateResult" }
        default: { $ref: "#/components/responses/Error" }
  /assistant/conversations/{id}:
    get:
      operationId: getAssistantConversation
      tags: [App]
      summary: 一个会话：最近的消息、待确认操作与接着读事件的位置
      parameters:
        - $ref: "#/components/parameters/AssistantID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAssistantConversationDetail" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAssistantConversation
      tags: [App]
      summary: 删除会话连同消息与待确认记录（正在回答的回 409）
      parameters:
        - $ref: "#/components/parameters/AssistantID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOK" }
        default: { $ref: "#/components/responses/Error" }
  /assistant/conversations/{id}/messages:
    post:
      operationId: sendAssistantMessage
      tags: [App]
      summary: 发一条消息并在后台开始回答（同一个会话同时只有一次运行，另一个回 409）
      parameters:
        - $ref: "#/components/parameters/AssistantID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppAssistantSend" }
      responses:
        "202":
          description: 开始的运行与落库的用户消息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAssistantSendResult" }
        default: { $ref: "#/components/responses/Error" }
  /assistant/conversations/{id}/cancel:
    post:
      operationId: cancelAssistantRun
      tags: [App]
      summary: 停止会话进行中的回答（没有时什么也不做）
      parameters:
        - $ref: "#/components/parameters/AssistantID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOK" }
        default: { $ref: "#/components/responses/Error" }
  /assistant/conversations/{id}/events:
    get:
      operationId: getAssistantEvents
      tags: [App]
      summary: 长轮询会话的事件：after 以后有事件马上回，没有时最多等 wait 秒
      parameters:
        - $ref: "#/components/parameters/AssistantID"
        - name: after
          in: query
          description: 上次读到的序号（会话详情的 last_seq，或者上一页的 last）
          schema: { type: integer, format: int64, minimum: 0 }
        - name: wait
          in: query
          description: 没有事件时最多等几秒，默认与上限都是 25
          schema: { type: integer, minimum: 0, maximum: 25 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAssistantEventPage" }
        default: { $ref: "#/components/responses/Error" }
  /assistant/confirmations/{id}:
    post:
      operationId: decideAssistantConfirmation
      tags: [App]
      summary: 确认或拒绝一个待确认的改动类操作（要 app:write；已经有结论的回 409）
      parameters:
        - $ref: "#/components/parameters/AssistantID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppAssistantDecide" }
      responses:
        "200":
          description: 有了结论的待确认操作
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAssistantConfirmation" }
        default: { $ref: "#/components/responses/Error" }
  /templates:
    get:
      operationId: listTemplates
      tags: [App]
      summary: 消息模板：事件的组、公共变量与各事件的变量、内置文字的样子与现在的模板
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTemplateCatalog" }
        default: { $ref: "#/components/responses/Error" }
  /templates/preview:
    post:
      operationId: previewTemplate
      tags: [App]
      summary: 用示例数据渲染一份模板（不保存；模板不对时回 400 并写明哪里不对）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppTemplatePreviewInput" }
      responses:
        "200":
          description: 渲染出来的标题与正文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTemplatePreview" }
        default: { $ref: "#/components/responses/Error" }
  /templates/{type}:
    put:
      operationId: saveTemplate
      tags: [App]
      summary: 保存一种事件的模板（要 app:write；先用示例数据校验，不对时回 400；两项都空等于恢复默认）
      parameters:
        - $ref: "#/components/parameters/TemplateType"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppTemplateInput" }
      responses:
        "200":
          description: 保存以后的这种事件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTemplate" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: resetTemplate
      tags: [App]
      summary: 恢复默认（要 app:write）
      parameters:
        - $ref: "#/components/parameters/TemplateType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOK" }
        default: { $ref: "#/components/responses/Error" }
  /config:
    get:
      operationId: getConfigCatalog
      tags: [App]
      summary: 配置目录（要 app:config 与 app:read）：能经接口读改的各类配置、能做的操作、能改的字段与密钥字段
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigCatalog" }
        default: { $ref: "#/components/responses/Error" }
  /config/{resource}:
    get:
      operationId: getConfig
      tags: [App]
      summary: 一类配置的现状（要 app:config 与 app:read）；密钥的值是 <已设置> 或空串
      parameters:
        - $ref: "#/components/parameters/ConfigResource"
        - name: id
          in: query
          required: false
          description: 列表类配置只看这一项（id_field 的值）
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigState" }
        default: { $ref: "#/components/responses/Error" }
  /config/{resource}/preview:
    post:
      operationId: previewConfigChange
      tags: [App]
      summary: 预览一次改动（要 app:config 与 app:read）：每个字段改以前、改以后与可能的影响，不保存
      parameters:
        - $ref: "#/components/parameters/ConfigResource"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppConfigChange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigResult" }
        default: { $ref: "#/components/responses/Error" }
  /config/{resource}/changes:
    post:
      operationId: applyConfigChange
      tags: [App]
      summary: 保存一次改动（要 app:config 与 app:write）：按现状重新算一遍再保存，回改完的样子
      parameters:
        - $ref: "#/components/parameters/ConfigResource"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppConfigChange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigResult" }
        default: { $ref: "#/components/responses/Error" }
  /mobile/options:
    get:
      operationId: getMobileOptions
      tags: [App]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppMobileOptions" }
        default: { $ref: "#/components/responses/Error" }
  /brush/tasks/{id}:
    get:
      operationId: getBrushTask
      tags: [App]
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppBrushConfig" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBrushTask
      tags: [App]
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppBrushInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppBrushConfig" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBrushTask
      tags: [App]
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOK" }
        default: { $ref: "#/components/responses/Error" }
  /brush/tasks/preview:
    post:
      operationId: previewBrushTask
      tags: [App]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppConfigChange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigResult" }
        default: { $ref: "#/components/responses/Error" }
  /brush/tasks/{id}/status:
    post:
      operationId: setBrushTaskStatus
      tags: [App]
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppBrushStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppBrushConfig" }
        default: { $ref: "#/components/responses/Error" }
  /brush/tasks/{id}/runs:
    get:
      operationId: listBrushTaskRuns
      tags: [App]
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppBrushRunPage" }
        default: { $ref: "#/components/responses/Error" }
  /stats/aggregated:
    get:
      operationId: getStatsAggregated
      tags: [App]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStatsAggregated" }
        default: { $ref: "#/components/responses/Error" }
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [App]
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [today, 7d, 30d] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStatsSummary" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: API 令牌（ptt_<id>_<secret>）。经远程访问配对的设备在隧道里调用，不带令牌。
  parameters:
    Site:
      name: site
      in: path
      required: true
      schema: { type: string }
    SubscriptionID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SubscriptionTorrentID:
      name: tid
      in: path
      required: true
      description: 订阅详情 torrents 里的 id
      schema: { type: integer, minimum: 1 }
    EpisodeNumber:
      name: n
      in: path
      required: true
      description: 集号（TMDB 这一季的第几集）
      schema: { type: integer, minimum: 1 }
    HistoryID:
      name: id
      in: path
      required: true
      description: 整理记录的编号（GET /media/history 的 id）
      schema: { type: integer, minimum: 1 }
    AssistantID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TemplateType:
      name: type
      in: path
      required: true
      description: 事件类型，例如 rss.matched、reply.status、assistant.reply
      schema: { type: string }
    ConfigResource:
      name: resource
      in: path
      required: true
      description: 配置的名字，例如 global、downloaders、sites、rss（GET /config 列出全部）
      schema: { type: string }
    Q:
      name: q
      in: query
      schema: { type: string, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSize100:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
  responses:
    Error:
      description: 出错
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AppError" }
  schemas:
    AppError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: invalid_body、invalid_argument、unauthorized、forbidden、not_found、method_not_allowed、busy、conflict、rate_limited、internal、search_failed、download_failed、attend_failed、upstream、unavailable、timeout、assistant_disabled、decided、too_many 等
        message: { type: string }
    AppOK:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    AppMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AppMeta:
      type: object
      required: [name, version, remote_api_level, features, principal]
      properties:
        name: { type: string }
        version: { type: string }
        remote_api_level: { type: integer }
        features:
          type: array
          items: { type: string }
        principal: { $ref: "#/components/schemas/AppPrincipal" }
    AppPrincipal:
      type: object
      required: [kind, scopes]
      properties:
        kind: { type: string, description: "api_token、session 或 remote_device" }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
    AppUpdates:
      type: object
      required: [current_version, has_update, checked_at]
      properties:
        current_version: { type: string }
        has_update: { type: boolean }
        new_releases:
          type: array
          items: { $ref: "#/components/schemas/AppRelease" }
        changelog_url: { type: string }
        has_more_releases: { type: boolean }
        checked_at: { type: integer, format: int64 }
        error: { type: string }
    AppRelease:
      type: object
      required: [version, name, changelog, url, published_at]
      properties:
        version: { type: string }
        name: { type: string }
        changelog: { type: string }
        url: { type: string }
        published_at: { type: integer, format: int64 }
        assets:
          type: array
          items: { $ref: "#/components/schemas/AppReleaseAsset" }
        prerelease: { type: boolean }
        prerelease_label: { type: string }
    AppReleaseAsset:
      type: object
      required: [name, download_url, size]
      properties:
        name: { type: string }
        download_url: { type: string }
        size: { type: integer, format: int64 }
    AppOverview:
      type: object
      required: [totals, today, updated_at]
      properties:
        totals: { $ref: "#/components/schemas/AppTotals" }
        today: { $ref: "#/components/schemas/AppDelta" }
        updated_at: { type: integer, format: int64 }
    AppTotals:
      type: object
      required:
        [
          uploaded,
          downloaded,
          ratio,
          seeding,
          leeching,
          bonus,
          bonus_per_hour,
          seeding_size,
          site_count,
          unread_messages,
        ]
      properties:
        uploaded: { type: integer, format: int64 }
        downloaded:
          type: integer
          format: int64
          description: "已启用站点的计费下载量合计：站点按优惠折算后的下载量（计入分享率），不是实际传输量"
        ratio: { type: number, format: double }
        seeding: { type: integer }
        leeching: { type: integer }
        bonus: { type: number, format: double }
        bonus_per_hour: { type: number, format: double }
        seeding_size: { type: integer, format: int64 }
        site_count: { type: integer }
        unread_messages: { type: integer }
    AppDelta:
      type: object
      required: [from, to, uploaded, downloaded, bonus, sites]
      properties:
        from: { type: string }
        to: { type: string }
        uploaded: { type: integer, format: int64 }
        downloaded:
          type: integer
          format: int64
          description: "今天计费下载量的增量；每日快照只存计费口径，没有实际传输量"
        bonus: { type: number, format: double }
        sites:
          type: array
          items: { $ref: "#/components/schemas/AppSiteDelta" }
        error: { type: string, description: 增量算不出来时的原因（这时的 0 不代表今天没有流量） }
    AppSiteDelta:
      type: object
      required: [site, uploaded, downloaded, bonus]
      properties:
        site: { type: string }
        uploaded: { type: integer, format: int64 }
        downloaded:
          type: integer
          format: int64
          description: "这个站点今天计费下载量的增量；每日快照只存计费口径，没有实际传输量"
        bonus: { type: number, format: double }
    AppSiteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppSite" }
        user_error: { type: string }
    AppSite:
      type: object
      required: [name, display_name, enabled, login, attendance]
      properties:
        name: { type: string }
        display_name: { type: string }
        enabled: { type: boolean }
        login: { $ref: "#/components/schemas/AppSiteLogin" }
        attendance: { $ref: "#/components/schemas/AppSiteAttendance" }
        user: { $ref: "#/components/schemas/AppSiteUser" }
    AppSiteLogin:
      type: object
      required: [tier, days_remaining]
      properties:
        tier: { type: string, description: "none、30d、14d、7d、3d、banned-imminent 或 unknown" }
        days_remaining: { type: integer }
        last_active_at: { type: integer, format: int64 }
        last_probe_at: { type: integer, format: int64 }
        last_probe_status: { type: string }
    AppSiteAttendance:
      type: object
      required: [supported, enabled, day]
      properties:
        supported: { type: boolean }
        enabled: { type: boolean }
        day: { type: string }
        status: { type: string, description: "pending、signed、already、failed 或 unsupported" }
        message: { type: string }
        last_attempt_at: { type: integer, format: int64 }
    AppSiteUser:
      type: object
      required:
        [
          username,
          uploaded,
          downloaded,
          ratio,
          bonus,
          seeding,
          leeching,
          unread_messages,
          updated_at,
        ]
      properties:
        username: { type: string }
        level: { type: string }
        uploaded: { type: integer, format: int64 }
        downloaded:
          type: integer
          format: int64
          description: "站点按优惠折算后的计费下载量（计入分享率），不是实际传输量"
        ratio: { type: number, format: double }
        bonus: { type: number, format: double }
        bonus_per_hour: { type: number, format: double }
        seeding: { type: integer }
        leeching: { type: integer }
        seeding_size: { type: integer, format: int64 }
        unread_messages: { type: integer }
        hnr_unsatisfied: { type: integer }
        updated_at: { type: integer, format: int64 }
    AppDownloaderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppDownloader" }
    AppDownloader:
      type: object
      required:
        [
          id,
          name,
          type,
          default,
          reachable,
          upload_speed,
          download_speed,
          uploaded,
          downloaded,
          free_space,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, description: "qbittorrent 或 transmission" }
        default: { type: boolean }
        reachable: { type: boolean }
        error: { type: string }
        version: { type: string }
        upload_speed: { type: integer, format: int64 }
        download_speed: { type: integer, format: int64 }
        uploaded: { type: integer, format: int64 }
        downloaded: { type: integer, format: int64 }
        free_space: { type: integer, format: int64 }
    AppTorrentPage:
      type: object
      required: [items, total, page, page_size, failures]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppTorrent" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        failures:
          type: array
          items: { $ref: "#/components/schemas/AppDownloaderFailure" }
    AppTorrent:
      type: object
      required:
        [
          downloader_id,
          downloader,
          task_id,
          info_hash,
          title,
          progress,
          size,
          state,
          ratio,
          seeds,
          peers,
          upload_speed,
          download_speed,
          eta,
          added_at,
          completed_at,
        ]
      properties:
        downloader_id: { type: integer }
        downloader: { type: string }
        task_id: { type: string }
        info_hash: { type: string }
        title: { type: string }
        progress: { type: number, format: double }
        size: { type: integer, format: int64 }
        state: { type: string }
        ratio: { type: number, format: double }
        seeds: { type: integer }
        peers: { type: integer }
        upload_speed: { type: integer, format: int64 }
        download_speed: { type: integer, format: int64 }
        eta: { type: integer, format: int64, description: 预计剩余秒数，-1 表示无法估计 }
        added_at: { type: integer, format: int64 }
        completed_at: { type: integer, format: int64 }
        category: { type: string }
        tags: { type: string }
        save_path: { type: string }
    AppDownloaderFailure:
      type: object
      required: [downloader_id, downloader, error]
      properties:
        downloader_id: { type: integer }
        downloader: { type: string }
        error: { type: string }
    AppTorrentTarget:
      type: object
      required: [downloader_id, task_id]
      properties:
        downloader_id: { type: integer }
        task_id: { type: string }
    AppTorrentActionsRequest:
      type: object
      required: [action, targets]
      additionalProperties: false
      properties:
