        id: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
        site: { type: string }
        site_enabled: { type: boolean }
        downloader: { type: string }
        active: { type: integer }
        downloading: { type: integer }
        active_size: { type: integer, format: int64 }
        today: { $ref: "#/components/schemas/AppBrushStat" }
        total: { $ref: "#/components/schemas/AppBrushStat" }
    AppMediaHistoryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppMediaHistory" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    AppMediaHistory:
      type: object
      required: [id, media_type, tmdb_id, title, torrent_name, mode, size, status, created_at]
      properties:
        id: { type: integer }
        media_type: { type: string }
        tmdb_id: { type: integer }
        title: { type: string }
        year: { type: integer }
        season: { type: integer }
        episode: { type: integer }
        episode_end: { type: integer }
        torrent_name: { type: string }
        library: { type: string }
        target_path: { type: string }
        mode: { type: string }
        size: { type: integer, format: int64 }
        status: { type: string }
        message: { type: string }
        created_at: { type: integer, format: int64 }
    AppMediaLibrary:
      type: object
      required: [id, name, kind, anime, path, mode, scrape, classify_dir, overwrite_mode, enabled]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, description: "movie 或 tv" }
        anime: { type: boolean, description: "只收 TMDB 类型里有「动画」的条目" }
        path: { type: string, description: "pt-tools 里看到的库目录" }
        mode:
          {
            type: string,
            description: "整理方式（hardlink、copy、move 等）；空的是整理设置里的默认方式",
          }
        scrape: { type: boolean, description: "写 NFO 与海报" }
        classify_dir: { type: boolean, description: "按二级分类放进库目录下的分类目录" }
        overwrite_mode:
          type: string
          description: "目标位置已经有 pt-tools 之前放进库的旧版本时：空的不替换，larger 新文件更大时替换"
        enabled: { type: boolean }
    AppRecognizeInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 512, description: "种子标题；与 subtitle 至少给一个" }
        subtitle: { type: string, maxLength: 512, description: "站点给的副标题（常是中文名）" }
        imdb_id: { type: string, description: "站点给的 IMDb 编号（tt1234567），可选" }
    AppMediaMeta:
      type: object
      description: 从种子标题解析出来的信息（没解析出来的字段没有）
      properties:
        name_cn: { type: string }
        name_en: { type: string }
        year: { type: integer }
        type: { type: string, description: "movie 或 tv" }
        season: { type: integer }
        season_end: { type: integer }
        episode: { type: integer }
        episode_end: { type: integer }
        complete: { type: boolean, description: "整季（或多季）的合集" }
        resolution: { type: string }
        source: { type: string }
        video_codec: { type: string }
        hdr:
          type: array
          items: { type: string }
        audio:
          type: array
          items: { type: string }
        group: { type: string }
        edition:
          type: array
          items: { type: string }
    AppMediaMatch:
      type: object
      required: [id, media_type, title]
      properties:
        id: { type: integer, description: "TMDB 编号" }
        media_type: { type: string, description: "movie 或 tv" }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster_path: { type: string, description: "海报经 GET /images/tmdb/{size}/{file} 取" }
        vote_average: { type: number }
        imdb_id: { type: string }
        score: { type: number, description: "候选的分数" }
    AppRecognition:
      type: object
      required: [summary, meta, source, candidates]
      properties:
        summary: { type: string, description: "给人看的一句话：名字、年份、季集" }
        meta: { $ref: "#/components/schemas/AppMediaMeta" }
        match: { $ref: "#/components/schemas/AppMediaMatch" }
        source:
          type: string
          description: "怎么认出来的：override（手动纠正过）、imdb（按站点给的 IMDb 编号）、search（按名字搜）、none（没认出来）"
        score: { type: number }
        candidates:
          type: array
          description: "最多 5 个候选（没有可靠的匹配时从这里挑）"
          items: { $ref: "#/components/schemas/AppMediaMatch" }
        message: { type: string, description: "提示，例如没有填 TMDB API Key、没有可靠的匹配" }
        error: { type: string, description: "TMDB 出错的原因（标题照样解析了）" }
    AppOrganizeInput:
      type: object
      required: [downloader_id, hash]
      additionalProperties: false
      properties:
        downloader_id: { type: integer, minimum: 1 }
        hash:
          type: string
          minLength: 1
          maxLength: 128
          description: "种子的 info_hash（GET /torrents 的 info_hash，没有时用 task_id）"
        media_type:
          type: string
          enum: [movie, tv]
          description: "与 tmdb_id 一起给时按这个条目整理，不自动识别"
        tmdb_id: { type: integer, minimum: 0 }
        library_id: { type: integer, minimum: 0, description: "不给时按类型选媒体库" }
    AppLibraryRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    AppOrganizeItem:
      type: object
      required: [rel, size, status]
      properties:
        rel: { type: string, description: "种子里的相对路径" }
        size: { type: integer, format: int64 }
        target: { type: string, description: "放进库里的位置" }
        season: { type: integer }
        episode: { type: integer }
        episode_end: { type: integer }
        status:
          type: string
          enum: [pending, done, exists, replace, failed]
          description: "pending 要整理，done 库里已经有了，exists 目标被别的文件占着（不覆盖），replace 换掉 pt-tools 之前放进库的旧版本，failed 整理不了"
        message: { type: string }
        history_id: { type: integer }
    AppOrganizePlan:
      type: object
      required: [downloader_id, downloader, hash, name, items, skipped]
      properties:
        downloader_id: { type: integer }
        downloader: { type: string }
        hash: { type: string }
        name: { type: string, description: "种子名" }
        match: { $ref: "#/components/schemas/AppMediaMatch" }
        library: { $ref: "#/components/schemas/AppLibraryRef" }
        category: { type: string, description: "放进的二级分类" }
        mode: { type: string, description: "整理方式" }
        items:
          type: array
          items: { $ref: "#/components/schemas/AppOrganizeItem" }
        skipped: { type: integer, description: "不整理的文件（样片、太小的、不是视频的）有几个" }
        problem: { type: string, description: "不为空时整个种子整理不了" }
    AppOrganizeResult:
      type: object
      required: [created, done, skipped, failed, messages, queued]
      properties:
        plan: { $ref: "#/components/schemas/AppOrganizePlan" }
        created: { type: integer, description: "这次整理出的文件数" }
        done: { type: integer, description: "库里已经有了的" }
        skipped: { type: integer }
        failed: { type: integer }
        messages:
          type: array
          items: { type: string }
        queued: { type: boolean, description: "还在后台进行（等不到结果就先回了），稍后看整理历史" }
    AppRescrapeResult:
      type: object
      required: [records, written, messages, queued]
      properties:
        records: { type: integer, description: "刮削了的整理记录数（同一部在这个媒体库里的）" }
        written: { type: integer, description: "写了的文件数（内容一样的不重写）" }
        messages:
          type: array
          items: { type: string }
        queued: { type: boolean, description: "还在后台刮削（等不到结果就先回了），稍后看整理历史" }
    AppProgress:
      type: object
      required: [total, aired, in_library, downloading, missing]
      properties:
        total: { type: integer }
        required:
          { type: integer, description: "要追的集数（起始集以后、没跳过的）；旧版本的服务端不给" }
        aired: { type: integer }
        in_library: { type: integer }
        downloading: { type: integer }
        waiting:
          {
            type: integer,
            description: "在等锁住的版本的集数（也算在 missing 里）；旧版本的服务端不给",
          }
        skipped: { type: integer, description: "不追的集数；旧版本的服务端不给" }
        missing:
          type: array
          items: { type: integer }
    AppSubscription:
      type: object
      required:
        [id, media_type, tmdb_id, season, title, status, upgrade, source, progress, created_at]
      properties:
        include_keywords: { type: string, maxLength: 1024 }
        exclude_keywords: { type: string, maxLength: 1024 }
        id: { type: integer }
        media_type: { type: string, description: "movie 或 tv" }
        tmdb_id: { type: integer }
        season: { type: integer }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        poster_path:
          { type: string, description: "TMDB 的海报路径，经 /images/tmdb/{size}/{file} 取图" }
        status: { type: string }
        upgrade: { type: boolean }
        source: { type: string }
        total_episodes: { type: integer }
        progress: { $ref: "#/components/schemas/AppProgress" }
        message: { type: string }
        last_search_at: { type: integer, format: int64 }
        next_search_at: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        # 在哪里找、推到哪里；旧版本的服务端不给
        profile_id: { type: integer, description: "质量档案（0 用设置里的默认）" }
        sites:
          type: array
          description: 只在这些站点找（空的是全部站点）
          items: { type: string }
        downloader_id: { type: integer, description: "推送到哪个下载器（0 用设置里的）" }
        category: { type: string }
        tags: { type: string, description: "推送时的标签，逗号分开" }
        save_path: { type: string, description: "推送时的保存目录（空的按下载器的默认）" }
        # 以下是追剧（剧集）的设置；旧版本的服务端不给
        schedule: { $ref: "#/components/schemas/AppSchedule" }
        lock_version:
          { type: boolean, description: "版本锁：第一集选定以后只要同一个制作组、同一个分辨率" }
        lock_group: { type: string, description: "锁住的制作组（还没定时为空）" }
        lock_resolution: { type: string, description: "锁住的分辨率（还没定时为空）" }
        start_episode: { type: integer, description: "从第几集开始追（0 与 1 是整季）" }
        follow_next_season: { type: boolean, description: "追完以后自动追下一季" }
        next_season_id: { type: integer, description: "自动建的下一季的订阅" }
        library_id: { type: integer, description: "整理进哪个媒体库（0 按类型自动选）" }
        completed_at: { type: integer, format: int64, description: "追完的时间" }
    AppSchedule:
      type: object
      required: [kind]
      additionalProperties: false
      description: >-
        主动搜索的定时。kind 为空沿用全局间隔；airtime 按播出时间（at 是当地的播出时刻，空的按 20:00；
        播出后 air_delay_hours 小时开始搜，没找到每隔 air_retry_hours 小时再搜，在播出后 air_window_days 天里集中重试，0 用默认的 2 小时、6 小时、7 天）；
        interval 每隔 interval_minutes 分钟搜一次（30 分钟到 7 天，从上次搜索算起）；
        daily、every_days、weekly、monthly 按 at 的钟点（every 是每隔几天，days 是星期几 0–6 或几号 1–31，短月按月末）；
        cron 按 cron 表达式（分 时 日 月 星期；几条用分号分开，到点的取最早的；两次搜索至少隔 30 分钟）。
      properties:
        kind:
          type: string
          description: "空的、airtime、interval、daily、every_days、weekly、monthly 或 cron（回应里不用枚举：以后加了新的种类，旧的 App 也读得了）"
        at: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "HH:MM" }
        every: { type: integer, minimum: 1, maximum: 30 }
        days:
          type: array
          items: { type: integer, minimum: 0, maximum: 31 }
        air_delay_hours: { type: integer, minimum: 0, maximum: 72 }
        air_retry_hours: { type: integer, minimum: 0, maximum: 48 }
        air_window_days: { type: integer, minimum: 0, maximum: 60 }
        interval_minutes:
          { type: integer, minimum: 30, maximum: 10080, description: "interval：每隔几分钟" }
        cron:
          type: string
          maxLength: 512
          description: "cron：例如「0 20 * * *」（每天 20:00）、「0 22 * * 5; 0 9,13 * * 6」（周五 22:00 与周六 9:00、13:00）"
    AppSchedulePreviewInput:
      type: object
      required: [schedule]
      additionalProperties: false
      properties:
        schedule: { $ref: "#/components/schemas/AppSchedule" }
        media_type:
          {
            type: string,
            description: "tv 或 movie；不给时按 subscription_id 的订阅，都没有时按剧集",
          }
        subscription_id:
          { type: integer, description: "按这个订阅的类型与建立时间算（每隔几天从建立那天对齐）" }
        count: { type: integer, minimum: 0, maximum: 10, description: "给几次，默认 5" }
    AppSchedulePreview:
      type: object
      required: [next]
      properties:
        next:
          type: array
          description: 接下来几次搜索的时间（Unix 秒，不算随机偏移；两次之间至少隔 30 分钟）
          items: { type: integer, format: int64 }
        note: { type: string, description: "按播出时间的不给时间，这里说明怎么算" }
    AppEpisode:
      type: object
      required: [number, state]
      properties:
        number: { type: integer }
        name: { type: string }
        air_date: { type: string }
        state:
          type: string
          description: "library、downloading、missing、waiting_version（在等锁住的版本）、upcoming 或 skipped（不追）"
        source:
          {
            type: string,
            description: "状态从哪里来：library（媒体库）、subscription（订阅推送的种子）、downloader（下载器里已有的种子）",
          }
        version: { type: string, description: "现在的版本（制作组与分辨率）" }
        manual_skip: { type: boolean, description: "手动跳过的" }
        manual_unlock: { type: boolean, description: "这一集不受版本锁限制" }
    AppSubscriptionTorrent:
      type: object
      required: [site, torrent_id, title, status, complete, size, created_at]
      properties:
        id: { type: integer, description: "重新整理、重新刮削用的编号；旧版本的服务端不给" }
        site: { type: string }
        torrent_id: { type: string }
        title: { type: string }
        status: { type: string }
        episode: { type: integer }
        episode_end: { type: integer }
        complete: { type: boolean }
        size: { type: integer, format: int64 }
        message: { type: string }
        created_at: { type: integer, format: int64 }
        files:
          type: array
          description: 每个视频文件的整理记录（还没整理过时为空）；旧版本的服务端不给
          items: { $ref: "#/components/schemas/AppTorrentFile" }
        can_organize:
          {
            type: boolean,
            description: "能重新整理：有整理没成、不在自动重试的文件，或者种子标成了失败",
          }
        can_rescrape: { type: boolean, description: "能重新刮削：有整理好的文件" }
    AppTorrentFile:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, description: "整理记录的编号（/media/history 的 id）" }
        name: { type: string, description: "源文件名" }
        episode: { type: integer }
        episode_end: { type: integer }
        status: { type: string, description: "done、failed、skipped 或 removed" }
        message: { type: string }
        scrape_status: { type: string, description: "ok、partial、failed；空的是没刮削过" }
        scrape_note: { type: string }
        next_retry_at: { type: integer, format: int64, description: "失败后下次自动重试的时间" }
        retrying: { type: boolean, description: "整理队列正在重试它" }
    AppSubscriptionDetail:
      allOf:
        - $ref: "#/components/schemas/AppSubscription"
        - type: object
          required: [episodes, torrents]
          properties:
            episodes:
              type: array
              items: { $ref: "#/components/schemas/AppEpisode" }
            torrents:
              type: array
              items: { $ref: "#/components/schemas/AppSubscriptionTorrent" }
    AppSubscriptionCreate:
      type: object
      required: [media_type, tmdb_id]
      additionalProperties: false
      properties:
        include_keywords: { type: string, maxLength: 1024 }
        exclude_keywords: { type: string, maxLength: 1024 }
        media_type: { type: string, enum: [movie, tv] }
        tmdb_id: { type: integer, minimum: 1 }
        season: { type: integer, minimum: 0 }
        profile_id: { type: integer, minimum: 0 }
        upgrade: { type: boolean }
        sites:
          type: array
          description: 只在这些站点找（不给或空的是全部站点）
          items: { type: string }
        downloader_id:
          { type: integer, minimum: 0, description: "推送到哪个下载器（0 用设置里的）" }
        category: { type: string, maxLength: 128 }
        tags: { type: string, maxLength: 128, description: "逗号分开" }
        save_path: { type: string, maxLength: 512 }
        # 以下只用于剧集（追剧）：不给的按播出时间搜索、开着版本锁
        schedule: { $ref: "#/components/schemas/AppSchedule" }
        lock_version: { type: boolean }
        start_episode: { type: integer, minimum: 0, maximum: 2000 }
        follow_next_season: { type: boolean }
        library_id: { type: integer, minimum: 0 }
        from_torrent: { $ref: "#/components/schemas/AppFromTorrent" }
    AppFromTorrent:
      type: object
      required: [site, torrent_id]
      additionalProperties: false
      description: 从站点上的这个种子开始追：起始集默认取它的集号，建好以后马上推送它（不合质量档案或已有这几集时不推）
      properties:
        site: { type: string, minLength: 1, maxLength: 64 }
        torrent_id: { type: string, minLength: 1, maxLength: 128 }
        title:
          type: string
          maxLength: 512
          description: 种子标题：只在搜索缓存里没有这个种子时，用作在这个站点上搜索的关键字
    AppSubscriptionUpdate:
      type: object
      additionalProperties: false
      description: 只改给了的字段（不给或给 null 的不变）；lock_group、lock_resolution 都给空串是清掉锁住的版本（按之后的版本重新定）
      properties:
        include_keywords: { type: string, maxLength: 1024 }
        exclude_keywords: { type: string, maxLength: 1024 }
        profile_id: { type: integer, minimum: 0 }
        upgrade: { type: boolean }
        sites:
          type: array
          nullable: true
          description: 只在这些站点找（空数组是全部站点；不给或 null 不变，生成的客户端没设时发 null）
          items: { type: string }
        downloader_id:
          { type: integer, minimum: 0, description: "推送到哪个下载器（0 用设置里的）" }
        category: { type: string, maxLength: 128 }
        tags: { type: string, maxLength: 128, description: "逗号分开" }
        save_path: { type: string, maxLength: 512 }
        schedule: { $ref: "#/components/schemas/AppSchedule" }
        lock_version: { type: boolean }
        lock_group: { type: string, maxLength: 64 }
        lock_resolution: { type: string, maxLength: 16 }
        start_episode: { type: integer, minimum: 0, maximum: 2000 }
        follow_next_season: { type: boolean }
        library_id: { type: integer, minimum: 0 }
        total_episodes:
          {
            type: integer,
            minimum: 0,
            maximum: 2000,
            description: "这一季的集数：大于 0 时以它为准，0 改回按 TMDB",
          }
    AppEpisodeSkip:
      type: object
      required: [skip]
      additionalProperties: false
      properties:
        skip: { type: boolean, description: "true 跳过这一集，false 重新要" }
    AppEpisodeUnlock:
      type: object
      required: [unlock]
      additionalProperties: false
      properties:
        unlock: { type: boolean, description: "true 这一集不受版本锁限制，false 恢复" }
    AppRunStep:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, description: "search、reject、lock、push、fail、adopt、wait 或 info" }
        text: { type: string }
    AppSubscriptionRun:
      type: object
      required: [id, trigger, started_at, status, summary, steps, steps_truncated]
      properties:
        id: { type: integer }
        trigger: { type: string, description: "create、schedule、rss、manual 或 ai" }
        started_at: { type: integer, format: int64 }
        finished_at: { type: integer, format: int64 }
        status:
          type: string
          description: "ok、nothing、waiting、failed、partial 或 changed（手动改动：改设置、跳过一集、换版本、集号规则，不是一次搜索）"
        summary: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/AppRunStep" }
        steps_truncated: { type: boolean, description: "步骤太多，后面的没有记" }
    AppSubscriptionRunPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppSubscriptionRun" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    AppEpisodeRule:
      type: object
      required: [group, mode, offset, source, updated_at]
      properties:
        group: { type: string, description: "制作组；空的对所有组" }
        mode:
          type: string
          description: "tmdb（按 TMDB 的集号）、period_part（按第几期与上下）、date（按播出日期）或 offset（TMDB 的集号 = 标题里的集号 + offset）"
        offset: { type: integer }
        source: { type: string, description: "manual、ai 或 auto" }
        note: { type: string }
        updated_at: { type: integer, format: int64 }
    AppEpisodeRuleInput:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        group: { type: string, maxLength: 64 }
        mode: { type: string, enum: [tmdb, period_part, date, offset] }
        offset:
          {
            type: integer,
            minimum: -2000,
            maximum: 2000,
            description: "mode 是 offset 时用，不能是 0",
          }
        note: { type: string, maxLength: 255 }
    AppSubscriptionStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [active, paused] }
    AppExplorePage:
      type: object
      required: [items, page, total_pages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppExploreItem" }
        page: { type: integer }
        total_pages: { type: integer }
    AppExploreItem:
      type: object
      required: [id, media_type, title, in_library, subscribed]
      properties:
        id: { type: integer }
        media_type: { type: string }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster_path: { type: string }
        vote_average: { type: number, format: double }
        in_library: { type: boolean }
        subscribed: { type: boolean }
        subscription_id: { type: integer }
    AppAssistantStatus:
      type: object
      required: [enabled, model, can_confirm, chatops]
      properties:
        enabled: { type: boolean, description: "启用了而且接口地址与模型都配好了" }
        model: { type: string, description: "没启用时为空" }
        can_confirm: { type: boolean, description: "调用者能不能确认改动类操作（有 app:write）" }
        chatops: { type: boolean, description: "通知渠道里的非命令消息交不交给助手" }
    AppAssistantConversation:
      type: object
      required: [id, title, entry, running, created_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string }
        entry: { type: string, description: "web、app 或 chatops：在哪里建的" }
        running: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AppAssistantToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string, description: "工具名（与 MCP 的工具相同）" }
        arguments: { type: string, description: "规范化、脱敏以后的参数（JSON 文本）" }
        write: { type: boolean, description: "改动类操作（要确认）" }
    AppAssistantAttachment:
      type: object
      required: [id, name, kind, mime, size]
      properties:
        id: { type: integer }
        name: { type: string, description: "文件名" }
        kind: { type: string, enum: [image, text] }
        mime:
          { type: string, description: "图片是 image/png 这类；文本是 text/plain; charset=utf-8" }
        size: { type: integer, format: int64, description: "上传的文件大小（字节）" }
    AppAssistantMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: integer }
        run_id: { type: string }
        role: { type: string, enum: [user, assistant, tool, notice] }
        content: { type: string, description: "脱敏以后的文字；tool 是工具返回的 JSON 文本" }
        reasoning:
          type: string
          description: "模型的推理内容（思考过程，脱敏以后的）：只有助手消息有，模型没给时没有"
        model:
          type: string
          description: "这一轮的模型：用户消息是发的时候选的，助手消息是实际请求的；没有时是设置里的模型"
        effort:
          type: string
          description: "这一轮的推理等级（none、minimal、low、medium、high、xhigh）；没有时是不指定"
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/AppAssistantToolCall" }
        attachments:
          type: array
          description: "用户消息带的附件（在网页上传的；内容不经 App API 给）"
          items: { $ref: "#/components/schemas/AppAssistantAttachment" }
        tool_name: { type: string }
        tool_call_id: { type: string }
        is_error: { type: boolean }
        created_at: { type: string, format: date-time }
    AppAssistantConfirmation:
      type: object
      required: [id, run_id, tool_call_id, tool, summary, arguments, status, expires_at, created_at]
      properties:
        id: { type: integer }
        run_id: { type: string }
        tool_call_id: { type: string }
        tool: { type: string }
        summary:
          { type: string, description: "给人看的一句话，例如「暂停种子：下载器 1，任务 abc」" }
        arguments: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, approved, denied, expired] }
        decided_by:
          type: string
          description: "属主，或者 timeout、cancel、restart、shutdown"
        decided_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        changes:
          type: array
          description: 写工具的预览：会改什么（改以前、改以后）；密钥两边都不写原文
          items: { $ref: "#/components/schemas/AppAssistantChange" }
        impact:
          type: array
          description: 写工具的预览：可能的影响
          items: { type: string }
    AppAssistantChange:
      type: object
      required: [label]
      properties:
        label: { type: string }
        before: { type: string, description: "新增的没有" }
        after: { type: string, description: "删掉的没有" }
        secret: { type: boolean, description: "密钥：两边都不写原文" }
    AppAssistantUsage:
      type: object
      required: [context, window, window_source, auto_compact, compact_percent, input, output]
      description: 会话的上下文用量
      properties:
        context: { type: integer, format: int64, description: "下一次请求大约要带的 token" }
        estimated: { type: boolean, description: "按字数估算的（服务商没报，或者刚压缩过）" }
        window: { type: integer, description: "上下文窗口（token）" }
        window_source: { type: string, description: "setting、provider、table 或 default" }
        auto_compact: { type: boolean }
        compact_percent: { type: integer, description: "用到窗口的这个比例时自动压缩" }
        input: { type: integer, format: int64, description: "本会话服务商报的输入 token 合计" }
        output: { type: integer, format: int64, description: "本会话服务商报的输出 token 合计" }
        compacted: { type: boolean, description: "这个会话压缩过" }
    AppAssistantConversationDetail:
      type: object
      required:
        [id, title, entry, running, created_at, updated_at, messages, confirmations, last_seq]
      properties:
        id: { type: integer }
        title: { type: string }
        entry: { type: string }
        running: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AppAssistantMessage" }
        confirmations:
          type: array
          items: { $ref: "#/components/schemas/AppAssistantConfirmation" }
        run_id: { type: string, description: "进行中的运行" }
        partial: { type: string, description: "进行中的运行到现在的回答文字" }
        partial_reasoning:
          type: string
          description: "进行中的运行这一步到现在的推理内容（思考过程）"
        last_seq:
          type: integer
          format: int64
          description: "读事件的 after：从它接着读不会漏"
        usage: { $ref: "#/components/schemas/AppAssistantUsage" }
    AppAssistantEvent:
      type: object
      required: [seq, type, at]
      description: >-
        会话事件流里的一个事件。只有下面这几种：推理内容的增量只在网页的事件流里（这里跳过，last 照样越过它们），
        推理内容在回答落库以后见消息的 reasoning。
      properties:
        seq: { type: integer, format: int64 }
        type:
          type: string
          enum: [run_started, delta, message, tool_started, confirmation, run_finished]
        run_id: { type: string }
        text: { type: string, description: "delta 的文字" }
        replace: { type: boolean, description: "为真时 text 是到现在的全部回答文字，整段替换" }
        message: { $ref: "#/components/schemas/AppAssistantMessage" }
        tool: { $ref: "#/components/schemas/AppAssistantToolCall" }
        confirmation: { $ref: "#/components/schemas/AppAssistantConfirmation" }
        status:
          { type: string, enum: [done, canceled, failed], description: "run_finished 的结束状态" }
        error: { type: string }
        at: { type: string, format: date-time }
    AppAssistantEventPage:
      type: object
      required: [events, reset, last, running]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AppAssistantEvent" }
        reset:
          type: boolean
          description: "中间的事件丢了（或者 pt-tools 重启过）：重新读会话，从它的 last_seq 接着读"
        last: { type: integer, format: int64, description: "下次读的 after" }
        running: { type: boolean }
    AppAssistantSendResult:
      type: object
      required: [run_id, message]
      properties:
        run_id: { type: string }
        message: { $ref: "#/components/schemas/AppAssistantMessage" }
    AppAssistantCreateResult:
      type: object
      required: [conversation]
      properties:
        conversation: { $ref: "#/components/schemas/AppAssistantConversation" }
        run: { $ref: "#/components/schemas/AppAssistantSendResult" }
    AppAssistantCreate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 4000 }
        model:
          type: string
          maxLength: 128
          description: "这一轮用的模型（不能有空格）；不给时用设置里的模型"
        effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh]
          description: "推理等级（reasoning_effort）；不给时不指定。模型服务不认时去掉它重试一次，会话里多一条提示"
    AppAssistantSend:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        model:
          type: string
          maxLength: 128
          description: "这一轮用的模型（不能有空格）；不给时用设置里的模型"
        effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh]
          description: "推理等级（reasoning_effort）；不给时不指定。模型服务不认时去掉它重试一次，会话里多一条提示"
    AppAssistantDecide:
      type: object
      required: [approve]
      additionalProperties: false
      properties:
        approve: { type: boolean, description: "true 确认执行，false 拒绝" }
    AppTemplateCatalog:
      type: object
      required: [groups, common_vars, events]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/AppTemplateGroup" }
        common_vars:
          type: array
          description: 每种事件都有的变量
          items: { $ref: "#/components/schemas/AppTemplateVar" }
        events:
          type: array
          items: { $ref: "#/components/schemas/AppTemplate" }
    AppTemplateGroup:
      type: object
      required: [key, name, desc]
      properties:
        key:
          {
            type: string,
            description: "notify（通知）、reply（ChatOps 命令回复）或 assistant（AI 助手回复）",
          }
        name: { type: string }
        desc: { type: string }
    AppTemplateVar:
      type: object
      required: [key, type, desc]
      properties:
        key: { type: string }
        type: { type: string, enum: [string, int, float, bool, list] }
        desc: { type: string }
        sample: { type: string, description: "示例值写成的文字；列表没有" }
        item:
          type: array
          description: 列表每一项的字段
          items: { $ref: "#/components/schemas/AppTemplateVar" }
    AppTemplate:
      type: object
      required:
        [
          type,
          group,
          name,
          desc,
          no_title,
          vars,
          sample_title,
          sample_text,
          title,
          text,
          customized,
        ]
      properties:
        type: { type: string }
        group: { type: string }
        name: { type: string }
        desc: { type: string }
        no_title: { type: boolean, description: "只有正文（ChatOps 命令回复与 AI 助手回复）" }
        vars:
          type: array
          items: { $ref: "#/components/schemas/AppTemplateVar" }
        sample_title: { type: string, description: 内置标题的样子 }
        sample_text: { type: string, description: 内置正文的样子 }
        title:
          {
            type: string,
            description: "标题模板，空着用内置标题；只给有 app:write 的调用者，只读的调用者是空的",
          }
        text:
          {
            type: string,
            description: "正文模板，空着用内置正文；只给有 app:write 的调用者，只读的调用者是空的",
          }
        customized: { type: boolean }
        updated_at: { type: integer, format: int64, description: 自定义的时间（秒级时间戳） }
    AppTemplateInput:
      type: object
      description: 空着的一项用内置文字；每份模板最长 8 KB（UTF-8 字节）。只有正文的事件不收标题
      properties:
        title: { type: string }
        text: { type: string }
    AppTemplatePreviewInput:
      type: object
      required: [type]
      properties:
        type: { type: string }
        title: { type: string }
        text: { type: string }
    AppTemplatePreview:
      type: object
      required: [title, text]
      properties:
        title: { type: string }
        text: { type: string }
    AppConfigCatalog:
      type: object
      required: [resources, excluded, secret_placeholder]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/AppConfigResource" }
        excluded:
          type: array
          description: 不能经接口读改、只能在网页上改的配置
          items: { type: string }
        secret_placeholder:
          { type: string, description: "有值的密钥读出来的样子；改的时候交回它表示不改" }
    AppConfigResource:
      type: object
      required: [name, title, description, kind, ops, fields]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        kind:
          {
            type: string,
            description: "object（一份设置，op 只能 set）或 list（一组，op 是 add、update、delete）",
          }
        id_field: { type: string, description: "列表类的编号字段" }
        ops:
          type: array
          items: { type: string }
        fields:
          type: array
          description: 能改的字段（config.<键> 这样的写法表示以它开头的字段都能改）
          items: { type: string }
        required:
          type: array
          description: 新增时必须给的字段
          items: { type: string }
        secrets:
          type: array
          description: 密钥字段：只写不读
          items: { type: string }
        hints:
          type: object
          description: 字段说明（字段 → 说明）
          additionalProperties: { type: string }
    AppConfigState:
      type: object
      required: [resource, kind]
      properties:
        resource: { type: string }
        kind: { type: string }
        id_field: { type: string }
        item:
          type: object
          description: 对象类配置的现状（键与网页接口的一样）
          additionalProperties: true
        items:
          type: array
          description: 列表类配置的各项（每项是一个对象，键与网页接口的一样）
          items: {}
    AppConfigChange:
      type: object
      required: [op]
      properties:
        op: { type: string, description: "set、add、update 或 delete" }
        id: { type: string, description: "update、delete 要给：id_field 的值" }
        values:
          type: object
          description: 只写要改的字段；密钥给新值才改，交回占位表示不改，给空串表示清除
          additionalProperties: true
    AppConfigDiff:
      type: object
      required: [label]
      properties:
        label: { type: string }
        field: { type: string }
        before: { type: string }
        after: { type: string }
        secret: { type: boolean, description: "密钥：两边都不写原文" }
    AppConfigResult:
      type: object
      required: [resource, op, summary, changes, impact, applied]
      properties:
        resource: { type: string }
        op: { type: string }
        id: { type: string, description: "新增出来的编号也在这里" }
        summary: { type: string }
        changes:
          type: array
          items: { $ref: "#/components/schemas/AppConfigDiff" }
        impact:
          type: array
          items: { type: string }
        applied: { type: boolean, description: "预览时为假" }
        item:
          type: object
          description: 改完的样子（删除时没有）
          additionalProperties: true

    AppMobileOption:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    AppMobileSiteOption:
      type: object
      required: [name, display_name]
      properties:
        name: { type: string }
        display_name: { type: string }
    AppMobileOptions:
      type: object
      required: [sites, downloaders, profiles, libraries]
      properties:
        sites:
          type: array
          items: { $ref: "#/components/schemas/AppMobileSiteOption" }
        downloaders:
          type: array
          items: { $ref: "#/components/schemas/AppMobileOption" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/AppMobileOption" }
        libraries:
          type: array
          items: { $ref: "#/components/schemas/AppMobileOption" }
        errors:
          type: object
          additionalProperties: { type: string }
    AppBrushConfig:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
        site_name: { type: string }
        downloader_id: { type: integer }
        save_path: { type: string }
        category: { type: string }
