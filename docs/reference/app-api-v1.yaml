        tags: { type: string }
        free: { type: boolean }
        free_level: { type: string }
        free_end_at: { type: integer, format: int64 }
        has_hr: { type: boolean }
        pushed: { type: boolean }
        pushed_at: { type: integer, format: int64 }
        downloader: { type: string }
        progress: { type: number, format: double }
        completed: { type: boolean }
        completed_at: { type: integer, format: int64 }
        source: { type: string }
