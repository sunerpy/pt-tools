name: Build mobile web assets
description: Build the bundled Vue editors and poster for the Flutter app
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.25.0
    - name: Build bundled editors
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        pnpm --dir web/frontend install --frozen-lockfile
        bash apps/mobile/tool/build_web.sh
