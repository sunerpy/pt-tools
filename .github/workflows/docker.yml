# 可复用容器发布 —— 作为 release.yml 的 same-run job 调用：
#
#   docker:
#     needs: [release-please, goreleaser]
#     if: needs.release-please.outputs.build_artifacts == 'true'
#     uses: ./.github/workflows/docker.yml
#     permissions:
#       attestations: write
#       contents: read
#       id-token: write
#       packages: write
#     secrets: inherit
#     with:
#       ref: ${{ needs.release-please.outputs.tag_name }}
#       tag_name: ${{ needs.release-please.outputs.tag_name }}
#       use_release_archives: true
#
# 并列入 publish-release.needs，使镜像失败时 draft 保留。
#
# 绝不可用 `release:` 或 `push: tags` 触发：用 GITHUB_TOKEN 创建的事件不会
# 启动任何 workflow run。
#
# 与 github-project-scaffold 的 docker-ghcr-reusable.yml 的差异（已在
# .github/scaffold.json 的 drift_allow 登记）：
#   1. 多注册表——GHCR（attested 主体）+ Docker Hub（sunerpy/pt-tools，
#      对外既有交付面）+ 可选的阿里云 ACR（vars.PUBLISH_ACR 为 'true' 时）；
#   2. build-args 对齐 pt-tools 的 Dockerfile（TAG / BUILD_TIME / COMMIT_ID /
#      BUILD_ENV），而非模板的 VERSION；
#   3. 下载同一 release run 的 GoReleaser 归档，将 Linux 二进制放进 Dockerfile
#      的 dist fast path。仅旧 tag 需要生成 vendor 目录；发布构建不执行
#      go mod tidy，也不独立编译 Go。
#   4. 保留 setup-qemu：runtime stage 仍执行目标架构的 apk 与 gosu --version。
name: Publish container

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
      tag_name:
        description: "Semantic release tag, for example v1.2.3"
        required: true
        type: string
      use_release_archives:
        description: "Reuse Linux binaries from this run's release-archives artifact"
        required: false
        default: false
        type: boolean
    outputs:
      digest:
        description: "Manifest digest of the pushed image (the same in every registry)"
        value: ${{ jobs.docker.outputs.digest }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
      tag_name:
        description: "Semantic release tag, for example v1.2.3"
        required: true
        type: string
permissions:
  contents: read

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify semantic tag and source
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG_NAME" =~ $semver ]]; then
            echo "::error::tag_name must be a v-prefixed semantic version"
            exit 1
          fi
          tag_commit=$(git rev-parse "${TAG_NAME}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::ref does not resolve to tag_name"
            exit 1
          fi

      - name: Derive the lowercase GHCR image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      # v0.47.2 等旧 tag 的 Dockerfile 无条件 COPY vendor；新版本不再需要。
      # 这里只为旧 tag 生成已锁定的 vendor 树，绝不运行 tidy。
      - name: Set up Go (context preparation)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ hashFiles('**/go.sum') != '' }}
          cache-dependency-path: "**/go.sum"

      - name: Download GoReleaser archives
        if: inputs.use_release_archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: release-archives

      - name: Prepare build context
        id: context
        shell: bash
        env:
          USE_RELEASE_ARCHIVES: ${{ inputs.use_release_archives }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if grep -Eq '^[[:space:]]*COPY[[:space:]]+vendor([[:space:]]|$)' Dockerfile; then
            go mod vendor
            test -s vendor/modules.txt
          fi

          if [ "$USE_RELEASE_ARCHIVES" = "true" ]; then
            for arch in amd64 arm64; do
              archive="release-archives/pt-tools-linux-${arch}.tar.gz"
              output="dist/pt-tools-linux-${arch}"
              test -s "$archive"

              members=$(tar -tzf "$archive" | grep -c '^pt-tools$' || true)
              if [ "$members" -ne 1 ]; then
                echo "::error title=Docker context::$archive must contain exactly one pt-tools binary"
                tar -tzf "$archive"
                exit 1
              fi

              tar -xOzf "$archive" pt-tools >"$output"
              chmod 0755 "$output"
              test -x "$output"
            done

            # Older release tags ignore every non-Go file by default. These
            # final negations make the injected binaries part of the context.
            printf '%s\n' \
              '!dist/' \
              '!dist/pt-tools-linux-amd64' \
              '!dist/pt-tools-linux-arm64' >>.dockerignore

            sha256sum dist/pt-tools-linux-amd64 dist/pt-tools-linux-arm64
            echo "build_env=release" >>"$GITHUB_OUTPUT"
          else
            echo "build_env=remote" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 国内镜像（阿里云 ACR）：仓库变量 PUBLISH_ACR 为 'true' 时才推。没有凭证时推送必然失败，所以默认不推；
      # ACR 个人版的命名空间要先在控制台手动建好。
      - name: Resolve ACR image
        id: acr
        if: vars.PUBLISH_ACR == 'true'
        shell: bash
        env:
          ACR_IMAGE: ${{ vars.ACR_IMAGE || 'registry.cn-hangzhou.aliyuncs.com/sunerpy/pt-tools' }}
        run: |
          set -euo pipefail
          echo "image=${ACR_IMAGE}" >>"$GITHUB_OUTPUT"
          echo "registry=${ACR_IMAGE%%/*}" >>"$GITHUB_OUTPUT"

      - name: Log in to Aliyun ACR
        if: vars.PUBLISH_ACR == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # ACR 一行在 PUBLISH_ACR 不是 'true' 时为空，metadata-action 忽略空行
          images: |
            ${{ steps.image.outputs.name }}
            sunerpy/pt-tools
            ${{ steps.acr.outputs.image }}
          # prerelease 不会命中 latest：metadata-action 的 semver pattern
          # 只对稳定版本发出 latest。
          tags: |
            type=raw,value=${{ inputs.tag_name }}
            type=semver,pattern={{version}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag_name }}

      - name: Resolve build metadata
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          echo "commit_id=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENV=${{ steps.context.outputs.build_env }}
            BUILD_IMAGE=golang:1.26.9@sha256:f1f0bcc2c524a3ced375fcb4d1ecb7aa371aa7070e112599aaca45cc02d0101b
            BASE_IMAGE=alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
            NODE_IMAGE=node:25.2.0-alpine@sha256:3f162243a45e30f6b20f80255779785789e142bec7b1d5d3b431f31d5b3610f6
            TAG=${{ inputs.tag_name }}
            BUILD_TIME=${{ steps.buildmeta.outputs.build_time }}
            COMMIT_ID=${{ steps.buildmeta.outputs.commit_id }}
            RELAY_URL=${{ secrets.PT_TOOLS_RELAY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  attest:
    name: Attest image provenance
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 为 attested 主体；Docker Hub 仅作镜像分发副本。
      - name: Attest the pushed image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.docker.outputs.image }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true
