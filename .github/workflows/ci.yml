# pt-tools CI —— 依据 CI/Release 迁移设计 v7 §4.3、§5。
#
# 关键结构决定：go-lint 与 go-security **不再** needs: frontend-build。
# 它们不检验前端内容，只需满足 web/server.go 的
#   //go:embed static/* static/dist/* static/dist/assets/*
# 因此用 `make embed-placeholder` 自备占位产物（两个 pattern 必须各自匹配到
# 文件），与前端构建完全并行。关键路径由 frontend + go 串行变为 max(两者)。
# 占位产物仅供静态检查，绝不可用于对外发布的二进制。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web/frontend
        run: pnpm lint:check

      - name: Type Check
        working-directory: web/frontend
        run: pnpm vue-tsc --noEmit

      - name: Build
        working-directory: web/frontend
        run: pnpm build

      - name: Upload Frontend Dist
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: web/static/dist
          retention-days: 7

  go-build-test:
    name: Go Build & Test
    # 唯一仍需真实前端产物的 Go job：测试会经由 web 包断言真实静态资源。
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Frontend Dist
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: web/static/dist

      - name: Set up Node.js (act local)
        if: ${{ env.ACT }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install pnpm (act local)
        if: ${{ env.ACT }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      - name: Build Frontend (act local)
        if: ${{ env.ACT }}
        run: make build-frontend

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      # 测试产出 coverage profile；下面两个门禁复用它，不重跑测试。
      - name: Run Tests
        run: |
          mkdir -p dist
          go test ./... -count=1 -race -cover -covermode=atomic -coverprofile=dist/coverage.out

      - name: Coverage gate
        run: make coverage-gate-check

      - name: Coverage exclusion parity
        run: make coverage-parity

      - name: Upload Coverage
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: dist/coverage.out
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ !env.ACT }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./dist/coverage.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 不检验前端内容，用占位产物满足 go:embed，从而与前端构建并行。
      - name: Create embed placeholder
        run: make embed-placeholder

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # 使用官方 action（自带二进制分发与 lint 结果缓存），版本固定；
      # 旧实现用 `go install ...@latest` 现编译，既慢又让上游发版能无关联地
      # 弄红本仓库，也可能与本地 make lint-go 结果不一致。
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  go-security:
    name: Go Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create embed placeholder
        run: make embed-placeholder

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # 版本固定，不用 @latest。
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      - name: Install Frontend Dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # 版本固定，与 Makefile 的 fail-closed 提示保持一致。
      - name: Install pinned Go formatters
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install mvdan.cc/gofumpt@v0.11.0

      # 工具链单一事实源门禁：10 类精确 pin + 2 类兼容区间。
      # 这类漂移必须在 PR 阶段红，而不是等到发布时才暴露（v0.47.0 事故根因）。
      - name: Toolchain check
        run: make toolchain-check

      # 只读校验：不再 `make fmt` 后比 git diff，避免在 CI 内改工作区。
      - name: Format check
        run: make fmt-check

      - name: Documentation links
        run: make docs-check

  extension-build:
    name: Extension Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      - name: Check site consistency
        run: node --experimental-strip-types scripts/check-sites.ts

      - name: Install and build
        working-directory: tools/browser-extension
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run extension tests
        working-directory: tools/browser-extension
        run: pnpm test

  cross-compile:
    name: Cross Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 发布产物含 windows/amd64 与 windows/arm64，均由 GoReleaser 在 Linux 上
      # 交叉编译产出，故这里用交叉编译守住「Windows 目标能编译」这条线。
      # 原生 windows-latest runner 唯一独有的价值是跑测试，但本仓库测试套件
      # 尚未 Windows-clean：t.TempDir 清理时 SQLite 句柄未关闭、日志轮转与
      # keyring 行为差异、符号链接需要特权等，跨 16 个包约 330 个失败。
      # 该测试债单独一轮处理，不在本次 CI/发布线标准化范围内。
      - name: Create embed placeholder
        run: make embed-placeholder

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -mod=readonly ./...

      - name: Build windows/arm64
        env:
          GOOS: windows
          GOARCH: arm64
        run: go build -mod=readonly ./...

      - name: Vet windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

  ci-success:
    name: CI Success
    needs:
      [
        frontend-build,
        go-build-test,
        go-lint,
        go-security,
        format-check,
        extension-build,
        cross-compile,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      # 逐一手写 if 链的旧实现有个致命缺陷：新增 job 若漏改判定，
      # 该 job 失败也能合并。改为对整个 needs JSON 求值，今后只需维护 needs。
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"
