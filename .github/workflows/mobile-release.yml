# 手机 App 的发版（路线图 M18）：不经过 release-please，也不复用 pt-tools 的发版控制器，与 pt-tools 的发版互不阻塞。
#
# 手动触发（只在受保护的 main 或 v1.0.0-rc 上）：
#   1. 校验 version 与 apps/mobile/pubspec.yaml 一致、tag mobile-v<version> 还不存在；
#   2. 构建按 ABI 拆分的 release APK，用 ANDROID_KEYSTORE_* 签名，apksigner 校验，生成 checksums.txt 与构建来源证明；
#   3. dry_run 为真时只上传成 workflow artifact；否则建 draft release mobile-v<version>（同时建 tag），上传资产、核对清单以后再发布，
#      任一步失败都停在 draft。
# PR 改到这个文件或 Android 工程时用临时生成的 keystore 跑一遍 dry_run（不需要 secret），确认流程本身走得通。
#
# secret：ANDROID_KEYSTORE_BASE64（keystore 文件的 base64）、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD；
# 可选变量 ANDROID_CERT_SHA256：签名证书的 SHA-256（apksigner 输出的写法），设了时核对签出来的证书是不是它。
name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App 版本 X.Y.Z 或 X.Y.Z-rc.N（与 apps/mobile/pubspec.yaml 的 version 一致，不含 +构建号）"
        required: true
        type: string
      dry_run:
        description: "只构建、签名与上传 artifact，不建 tag 与 release"
        required: true
        type: boolean
        default: true
  pull_request:
    branches: [main, v1.0.0-rc]
    paths:
      - ".github/workflows/mobile-release.yml"
      - ".github/actions/setup-flutter/**"
      - "apps/mobile/android/**"
      - "apps/mobile/pubspec.yaml"

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Mobile Release · Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Require a protected branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$RUN_REF" in
          refs/heads/main | refs/heads/v1.0.0-rc) ;;
          *)
            echo "::error title=Mobile release::release only from main or v1.0.0-rc, not ${RUN_REF}"
            exit 1
            ;;
          esac
          if [ "$REF_PROTECTED" != true ]; then
            echo "::error title=Mobile release::${RUN_REF} is not protected"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version
        id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          pub=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*$/\1/p' apps/mobile/pubspec.yaml)
          if [ "$EVENT" = workflow_dispatch ]; then
            version=$INPUT_VERSION
            dry_run=$INPUT_DRY_RUN
          else
            version=$pub
            dry_run=true
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error title=Mobile release::version '$version' is not X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi
          if [ "$version" != "$pub" ]; then
            echo "::error title=Mobile release::version $version does not match apps/mobile/pubspec.yaml ($pub)"
            exit 1
          fi
          if [ "$dry_run" != true ]; then
            # 0 = 已经有这个 tag，2 = 没有
            set +e
            git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/mobile-v$version" >/dev/null
            rc=$?
            set -e
            if [ "$rc" -ne 2 ]; then
              echo "::error title=Mobile release::tag mobile-v$version already exists (or the lookup failed: $rc)"
              exit 1
            fi
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "version $version, dry run: $dry_run"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # 正式发版用 secret 里的 keystore；dry run 没有 secret 时现生成一把只用这一次的测试密钥（产物不能发布）
      - name: Prepare the signing key
        id: key
        shell: bash
        env:
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$keystore"
            echo "signing=release" >>"$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = true ]; then
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass dry-run-only -keypass dry-run-only \
              -alias dry-run -keyalg RSA -keysize 3072 -validity 30 -dname "CN=pt-tools dry run (not for release)" >/dev/null
            echo "signing=test" >>"$GITHUB_OUTPUT"
          else
            echo "::error title=Mobile release::secret ANDROID_KEYSTORE_BASE64 is not set; a release must be signed with the release key"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore" >>"$GITHUB_ENV"

      - name: Build split release APKs
        working-directory: apps/mobile
        shell: bash
        env:
          SIGNING: ${{ steps.key.outputs.signing }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" = release ]; then
            export ANDROID_KEYSTORE_PASSWORD=$RELEASE_STORE_PASSWORD ANDROID_KEY_ALIAS=$RELEASE_KEY_ALIAS ANDROID_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          else
            export ANDROID_KEYSTORE_PASSWORD=dry-run-only ANDROID_KEY_ALIAS=dry-run ANDROID_KEY_PASSWORD=dry-run-only
          fi
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Verify signatures and stage assets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNING: ${{ steps.key.outputs.signing }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          apksigner="$ANDROID_HOME/build-tools/$tools/apksigner"
          mkdir -p upload
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="apps/mobile/build/app/outputs/flutter-apk/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error title=Mobile release::missing $src"; exit 1; }
            certs=$("$apksigner" verify --print-certs "$src")
            cert=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [ -n "$cert" ] || { echo "::error title=Mobile release::$src is not signed"; exit 1; }
            if [ "$SIGNING" = release ] && [ -n "$EXPECTED_CERT" ] && [ "$cert" != "$EXPECTED_CERT" ]; then
              echo "::error title=Mobile release::$src is signed by $cert, not vars.ANDROID_CERT_SHA256"
              exit 1
            fi
            suffix=""
            [ "$SIGNING" = release ] || suffix="-test-signed"
            cp "$src" "upload/pt-tools-app-$VERSION-$abi$suffix.apk"
            echo "$abi: $cert"
          done
          (cd upload && sha256sum ./*.apk | sed 's# \./# #' >checksums.txt)
          ls -l upload
          cat upload/checksums.txt

      - name: Attest build provenance
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: upload/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pt-tools-app-${{ steps.meta.outputs.version }}
          path: upload
          if-no-files-found: error
          retention-days: 14

  release:
    name: Mobile Release · Publish
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pt-tools-app-${{ needs.build.outputs.version }}
          path: upload

      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'mobile-v*' --sort=-v:refname | head -1)
          range=${prev:+$prev..}HEAD
          {
            echo "## pt-tools App $VERSION"
            echo
            echo "Android 安装包（按 CPU 架构分开，大多数手机用 arm64-v8a）。用法见 [手机 App](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/guide/mobile-app.md)。"
            echo
            echo "### 改动${prev:+（自 $prev 以来）}"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" -- apps/mobile | head -100
            echo
            echo "校验：checksums.txt 是各 APK 的 SHA-256；构建来源证明见本仓库的 Attestations。"
          } >notes.md
          cat notes.md

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--draft --target "$GITHUB_SHA" --title "pt-tools App $VERSION" --notes-file notes.md)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "mobile-v$VERSION" "${flags[@]}" upload/*

      - name: Check the assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          expected=$(find upload -maxdepth 1 -type f -printf '%f\n' | sort)
          actual=$(gh release view "mobile-v$VERSION" --json assets --jq '.assets[].name' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error title=Mobile release::assets differ from the build; the release stays a draft"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          gh release edit "mobile-v$VERSION" --draft=false
          echo "published mobile-v$VERSION"
